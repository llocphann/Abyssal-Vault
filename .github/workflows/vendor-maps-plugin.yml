name: Vendor Maps plugin

on:
  push:
    branches:
      - template-map-readme-cleanup
    paths:
      - .github/workflows/vendor-maps-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: template-map-readme-cleanup

      - name: Download official Maps 0.2.2 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .obsidian/plugins/maps
          curl --fail --location --retry 3 \
            https://github.com/obsidianmd/obsidian-maps/releases/download/0.2.2/main.js \
            -o .obsidian/plugins/maps/main.js
          curl --fail --location --retry 3 \
            https://github.com/obsidianmd/obsidian-maps/releases/download/0.2.2/manifest.json \
            -o .obsidian/plugins/maps/manifest.json
          curl --fail --location --retry 3 \
            https://github.com/obsidianmd/obsidian-maps/releases/download/0.2.2/styles.css \
            -o .obsidian/plugins/maps/styles.css
          echo 'ebe69bada2dfe5d1230ea5bf5406a0f35ccd6a6e62bb9b235ee623920545f05f  .obsidian/plugins/maps/main.js' | sha256sum -c -
          echo '6ad71e2fe4f6b425cfd9fddecbe1321894a0130e3c06c4e59f02889b3b7eed96  .obsidian/plugins/maps/manifest.json' | sha256sum -c -
          echo '63f71db74e8f3ae39350d4265d03aaf8839ad3a098bcbe1e33f254258a8258f6  .obsidian/plugins/maps/styles.css' | sha256sum -c -

      - name: Commit vendored plugin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .obsidian/plugins/maps
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(map): vendor official Maps 0.2.2 plugin'
          git push origin HEAD:template-map-readme-cleanup
