name: Sync required plugin bundles

on:
  push:
    paths:
      - ".github/workflows/sync-required-plugin-bundles.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exact plugin bundles
        shell: bash
        run: |
          set -euo pipefail

          download_plugin() {
            id="$1"
            repo="$2"
            version="$3"
            dir=".obsidian/plugins/$id"
            base="https://github.com/$repo/releases/download/$version"

            mkdir -p "$dir"
            curl -fsSL --retry 3 "$base/main.js" -o "$dir/main.js"
            printf '\n/* nosourcemap */' >> "$dir/main.js"
            curl -fsSL --retry 3 "$base/manifest.json" -o "$dir/manifest.json"
            curl -fsSL --retry 3 "$base/styles.css" -o "$dir/styles.css"
          }

          verify() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch: $path expected $expected got $actual" >&2
              exit 1
            fi
          }

          download_plugin homepage mirnovov/obsidian-homepage 4.5.0
          download_plugin custom-views anupchavan/obsidian-custom-views 0.4.0
          download_plugin maps obsidianmd/obsidian-maps 0.2.2
          download_plugin templater-obsidian SilentVoid13/Templater 2.25.0

          cat > .obsidian/plugins/homepage/data.json <<'JSON'
          {
            "version": 4,
            "homepages": {
              "Main Homepage": {
                "value": "90_System/98_Homepage/Homepage",
                "kind": "File",
                "openOnStartup": true,
                "openMode": "Keep open notes",
                "manualOpenMode": "Keep open notes",
                "view": "Reading view",
                "revertView": true,
                "openWhenEmpty": true,
                "refreshDataview": true,
                "autoCreate": true,
                "autoScroll": false,
                "pin": true,
                "commands": [],
                "alwaysApply": true,
                "hideReleaseNotes": true
              }
            },
            "separateMobile": false
          }
          JSON

          rm -f .obsidian/plugins/custom-views/data.json

          verify .obsidian/plugins/homepage/main.js baece952928dac000a981cf4958c021e6cd7e417
          verify .obsidian/plugins/homepage/manifest.json c5f05835ca9fd9f3bd5f25f6af3b1213f9888861
          verify .obsidian/plugins/homepage/styles.css bd05d848344e1becd5fabbaeed2bc5625239352c
          verify .obsidian/plugins/homepage/data.json 8cc1987f4f6d3b3252028180b25fe9241a5f56b2

          verify .obsidian/plugins/custom-views/main.js a93874f7b4eb0450a3bdbcff184e48e219958cc7
          verify .obsidian/plugins/custom-views/manifest.json 824b5edd9bd1f95768a4afa1bc788b3bfe1b1c1d
          verify .obsidian/plugins/custom-views/styles.css 56d3ffd62d293393619e3dcd5aee1e350024b4b4

          verify .obsidian/plugins/maps/main.js e2aa4a2045b63945644594f9534899fa1e5d238a
          verify .obsidian/plugins/maps/manifest.json a34ca15f9f6423606c5ba711d0b376e294efb6ae
          verify .obsidian/plugins/maps/styles.css 9075a26798f10fa9ba87cf307f7a04d0ab85fdc2

          verify .obsidian/plugins/templater-obsidian/main.js 1d04acf009f7f6aac37c375b6bc51a2f07412268
          verify .obsidian/plugins/templater-obsidian/manifest.json d8e1f5eae64328727353696c13e28cd18eff9c18
          verify .obsidian/plugins/templater-obsidian/styles.css d46f1c509c0986b9787f31e5b28de1d66e77c1a3

      - name: Commit bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .obsidian/plugins
          if git diff --cached --quiet; then
            echo "No plugin changes to commit."
            exit 0
          fi
          git commit -m "chore: bundle required community plugins"
          git push
